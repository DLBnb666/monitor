name: BuildDex
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-33" "build-tools;33.0.0"
      - run: javac -source 1.8 -target 1.8 -cp $ANDROID_HOME/platforms/android-33/android.jar -d . com/example/Monitor.java
      - run: $ANDROID_HOME/build-tools/33.0.0/d8 --output . com/example/*.class && mv classes.dex monitor.dex
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-dex
          path: monitor.dex
